<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple background circle -->
  <circle cx="50" cy="50" r="45" fill="#915EFF"/>
  
  <!-- Geometric stylish M -->
  <path d="M25 70 L35 40 L45 60 L55 40 L65 60 L75 40 L85 70" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="square" 
        stroke-linejoin="miter" 
        fill="none"/>
  
  <!-- Add geometric accent lines -->
  <line x1="30" y1="35" x2="30" y2="45" stroke="#ffffff" stroke-width="2"/>
  <line x1="70" y1="35" x2="70" y2="45" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Corner accents -->
  <rect x="20" y="20" width="3" height="3" fill="#ffffff"/>
  <rect x="77" y="20" width="3" height="3" fill="#ffffff"/>
</svg>
